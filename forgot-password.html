<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="images/fav.png"><link rel="stylesheet" href="assets/css/login.css"><title>Reset Password | Training Management</title></head><body><div class="login-shell"><section class="login-brand"><div><img src="images/training-logo.png"></div><div><h1>Password Reset</h1><p>Request a secure password-reset link for your Screenings4u staff account.</p></div></section><section class="login-form"><h2>Forgot password?</h2><p>Enter your staff email address.</p><div id="status" class="status" hidden></div><form id="form"><div class="field"><label>Email</label><input name="email" type="email" required></div><button class="btn" type="submit">Send Reset Link</button></form><div class="links"><a href="login.html">Back to Sign In</a></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('status');s.hidden=false;s.textContent='Sending…';const r=await window.trainingSupabase.auth.resetPasswordForEmail(e.target.email.value.trim(),{redirectTo:'https://training-portal.screenings4u.com/reset-password.html'});s.textContent=r.error?r.error.message:'Password reset link sent.';s.className='status'+(r.error?' error':'')});</script></body></html>
