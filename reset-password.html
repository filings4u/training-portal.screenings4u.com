<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="images/fav.png"><link rel="stylesheet" href="assets/css/login.css"><title>Set Password | Training Management</title></head><body><div class="login-shell"><section class="login-brand"><div><img src="images/training-logo.png"></div><div><h1>Set Password</h1><p>Create a new password for your Screenings4u staff account.</p></div></section><section class="login-form"><h2>New password</h2><div id="status" class="status" hidden></div><form id="form"><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Confirm Password</label><input name="confirm" type="password" minlength="8" required></div><button class="btn" type="submit">Update Password</button></form></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('status');s.hidden=false;if(e.target.password.value!==e.target.confirm.value){s.textContent='Passwords do not match.';s.className='status error';return}const r=await window.trainingSupabase.auth.updateUser({password:e.target.password.value});if(r.error){s.textContent=r.error.message;s.className='status error';return}s.textContent='Password updated. Redirecting…';location.replace('login.html')});</script></body></html>
